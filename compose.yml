services:
  catalog:
    image: maheshsanju/catalogapi:v1.0.0
    container_name: catalog
    networks:
      - busnet
    ports:
      - "8080:8080"
  booking:
    image: maheshsanju/bookingapi:v1.0.0
    container_name: booking
    depends_on:
      - catalog
    networks:
      - busnet
    ports:
      - "8081:8081"
    environment:
        ASPNETCORE_ENVIRONMENT: Production
        Azure__CatalogApiBaseUrl: http://20.204.55.88:8080/
  bookingweb:
    image: maheshsanju/bookingwebui:v1.0.0
    container_name: bookingweb
    depends_on:
      - booking
    networks:
      - busnet
    ports:
      - "8082:8082"
networks:
  busnet:
    driver: bridge
